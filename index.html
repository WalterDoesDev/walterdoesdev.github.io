<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Walter's Page</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="backdrop"></div>

	<div class="audio-controls">
		<button id="music-toggle" class="music-btn" title="Toggle music">🔊</button>
	</div>

	<audio id="background-music" loop>
		<source src="background-music.mp3" type="audio/mpeg">
		Your browser does not support the audio element.
	</audio>

	<div class="topnavbar">
		<h1 class="mw">Walter's Page</h1>
		<a class="navlink" href="blender-portfolio/">Blender</a>
 	</div>

 	<div class="textbox">
		<p class="mwp">Hello! My name is Walter, <br>
		   currently 11, I personally Like programming in<br>
		   C, Python, Shell Script, <br>
		   Assembly (which i am horrible and is a piece of garbage).
		   <hr> </p>
		   <p class="mwp">I Also Like to play Minecraft, CS2 (i am bad),<br>
		   No Man's Sky, and about 20 more!</p>
	</div>

	<div class="videosidebar">
		<div id="youtube-videos"></div>
	</div>

	<script>
		// Background music controls
		const audioElement = document.getElementById('background-music');
		const musicToggle = document.getElementById('music-toggle');
		let isPlaying = false;

		// Set initial volume to 30%
		audioElement.volume = 0.3;

		// Play music with user interaction
		document.addEventListener('click', function enableAudio() {
			if (!isPlaying) {
				audioElement.play().catch(err => console.log('Autoplay prevented:', err));
				isPlaying = true;
				musicToggle.textContent = '🔊';
				musicToggle.classList.add('playing');
				document.removeEventListener('click', enableAudio);
			}
		});

		// Toggle music on button click
		musicToggle.addEventListener('click', (e) => {
			e.stopPropagation();
			if (isPlaying) {
				audioElement.pause();
				isPlaying = false;
				musicToggle.textContent = '🔇';
				musicToggle.classList.remove('playing');
			} else {
				audioElement.play();
				isPlaying = true;
				musicToggle.textContent = '🔊';
				musicToggle.classList.add('playing');
			}
		});

		// YouTube videos fetch
		const channelId = 'UC8eqKZX3qF8Nf-x6C55caVQ';
		const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
		const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

		fetch(apiUrl)
			.then(r => r.json())
			.then(data => {
				const videos = data.items
					.filter(v => !v.link.includes('/shorts/'))
					.slice(0, 3);

				const container = document.getElementById('youtube-videos');
				container.innerHTML = videos.map(v => `
					<a class="video-card" href="${v.link}" target="_blank">
						<div class="video-thumb" style="background-image: url(${v.thumbnail})">
							<div class="video-play"></div>
						</div>
						<p class="video-title">${v.title}</p>
					</a>
				`).join('');
			})
			.catch(() => {
				document.getElementById('youtube-videos').innerHTML =
					'<p class="mwp">Could not load videos.</p>';
			});
	</script>
</body>
</html>
